name: Validate custom nodes
on:
  push:
    branches: [work/hybrid-lettering]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: manga_translator
    steps:
      - uses: actions/checkout@v4
        with:
          path: manga_translator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU verification dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy Pillow scipy fonttools
      - name: Run regression tests
        run: python -m pytest -q --tb=short
      - name: Execute integrated graph simulation
        run: python tools/simulate_integrated.py --destination validation/simulation
      - name: Build and verify installable ZIP
        run: python tools/package_style_lettering.py --destination validation/package
      - name: Show package checksums
        run: cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: manga-translator-validation
          path: manga_translator/validation
