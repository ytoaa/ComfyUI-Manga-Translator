name: Validate custom nodes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: manga_translator
    steps:
      - uses: actions/checkout@v4
        with:
          path: manga_translator
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU verification dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy Pillow scipy fonttools psutil 'pydantic>=2,<3'
      - name: Verify registered source, docs and provenance
        run: python tools/check_repository.py
      - name: Compile Python sources
        run: python -m compileall -q adapters lettering tools tests *.py
      - name: Verify native canvas frontend contract
        run: node tools/check_canvas_frontend.cjs
      - name: Verify committed workflow matches its generator
        run: |
          python tools/build_integrated_workflow.py
          git diff --exit-code -- lettering/example_workflows
      - name: Run regression tests
        run: python -m pytest tests -q --confcutdir=tests --tb=short
      - name: Execute integrated graph simulation
        run: python tools/simulate_integrated.py --destination validation/simulation
      - name: Render hybrid typography examples
        run: python tools/demo_hybrid_lettering.py --destination validation/hybrid
      - name: Build and verify runtime and source ZIPs
        run: |
          python tools/package_style_lettering.py --destination validation/package
          python tools/package_style_lettering.py --destination validation/package --include-development
      - name: Show package checksums
        run: cat validation/package/*.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: manga-translator-validation
          path: manga_translator/validation
